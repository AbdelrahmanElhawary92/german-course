<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>كورس الألماني العملي — من اللغة إلى الاستخدام الحقيقي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Segoe UI", sans-serif;
      background: #f7f9fc;
      color: #1f2937;
      line-height: 1.8;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: 90%;
      max-width: 1150px;
      margin: auto;
    }

    /* =========================
       LANGUAGE SWITCHER
    ========================= */

    .language-bar {
      position: absolute;
      top: 20px;
      left: 25px;
      z-index: 10;
    }

    html[dir="ltr"] .language-bar {
      left: auto;
      right: 25px;
    }

    .language-switch {
      display: flex;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 30px;
      padding: 4px;
      backdrop-filter: blur(8px);
    }

    .language-switch button {
      border: none;
      background: transparent;
      color: white;
      padding: 8px 14px;
      border-radius: 22px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: 0.3s;
    }

    .language-switch button.active {
      background: white;
      color: #1d4ed8;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      text-align: center;
      padding: 95px 20px 80px;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      top: -120px;
      right: -100px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 8px 18px;
      border-radius: 30px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .hero h1 {
      font-size: 42px;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .hero h1 span {
      display: block;
      color: #dbeafe;
    }

    .hero p {
      max-width: 800px;
      margin: auto;
      font-size: 20px;
      color: #eff6ff;
    }

    .hero-buttons {
      margin-top: 30px;
    }

    .btn {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
      margin: 5px;
    }

    .btn-primary {
      background: white;
      color: #1d4ed8;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid rgba(255,255,255,0.6);
      color: white;
    }

    .btn-outline:hover {
      background: rgba(255,255,255,0.1);
    }

    /* =========================
       GENERAL SECTIONS
    ========================= */

    section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 15px;
      color: #111827;
    }

    .section-subtitle {
      text-align: center;
      color: #6b7280;
      max-width: 750px;
      margin: 0 auto 40px;
    }

    /* =========================
       TARGET
    ========================= */

    .target {
      background: white;
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .target-card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 25px;
    }

    .target-card h3 {
      margin-bottom: 8px;
      color: #1d4ed8;
    }

    /* =========================
       FEATURES
    ========================= */

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .feature {
      background: white;
      padding: 28px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .feature-icon {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .feature h3 {
      margin-bottom: 8px;
      color: #111827;
    }

    .feature p {
      color: #6b7280;
    }

    /* =========================
       COURSE CONTENT
    ========================= */

    .content {
      background: white;
    }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      max-width: 900px;
      margin: auto;
    }

    .content-item {
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px 22px;
      border: 1px solid #e5e7eb;
    }

    .content-item::before {
      content: "✓";
      color: #2563eb;
      font-weight: bold;
      margin-left: 8px;
    }

    html[dir="ltr"] .content-item::before {
      margin-left: 0;
      margin-right: 8px;
    }

    /* =========================
       COURSE DETAILS
    ========================= */

    .details {
      background: #eff6ff;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .detail {
      background: white;
      text-align: center;
      padding: 25px 15px;
      border-radius: 14px;
    }

    .detail strong {
      display: block;
      font-size: 25px;
      color: #1d4ed8;
      margin-bottom: 5px;
    }

    /* =========================
       VIDEO
    ========================= */

    .video-wrapper {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 12px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
    }

    .video-container iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      top: 0;
      left: 0;
    }

    .video-title {
      text-align: center;
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .video-highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .video-highlight {
      background: #f8fafc;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    /* =========================
       INSTRUCTOR
    ========================= */

    .instructor {
      background: white;
      text-align: center;
    }

    .instructor-photo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      margin: 0 auto 20px;
      border: 4px solid #ffffff;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
    }

    .instructor h3 {
      font-size: 26px;
      margin-bottom: 12px;
    }

    .instructor-description {
      max-width: 750px;
      margin: auto;
      color: #4b5563;
      font-size: 17px;
    }

    /* =========================
       PRICING
    ========================= */

    .pricing {
      background: #f7f9fc;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      max-width: 850px;
      margin: auto;
    }

    .price-card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      text-align: center;
      border: 1px solid #e5e7eb;
      position: relative;
    }

    .price-card.premium {
      border: 2px solid #2563eb;
    }

    .premium-label {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      background: #2563eb;
      color: white;
      padding: 5px 18px;
      border-radius: 20px;
      font-size: 13px;
    }

    .price-card h3 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 42px;
      font-weight: bold;
      color: #1d4ed8;
      margin-bottom: 20px;
    }

    .price-card ul {
      list-style: none;
      text-align: start;
      margin-bottom: 25px;
    }

    .price-card li {
      padding: 7px 0;
    }

    .price-card li::before {
      content: "✓";
      color: #2563eb;
      font-weight: bold;
      margin-left: 8px;
    }

    html[dir="ltr"] .price-card li::before {
      margin-left: 0;
      margin-right: 8px;
    }

    /* =========================
       CONSULTATION
    ========================= */

    .consultation {
      background: #eff6ff;
      text-align: center;
    }

    .consultation-box {
      background: white;
      max-width: 700px;
      margin: auto;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .consultation-price {
      font-size: 38px;
      color: #1d4ed8;
      font-weight: bold;
      margin: 15px 0;
    }

    /* =========================
       FAQ
    ========================= */

    .faq {
      background: white;
    }

    .faq-list {
      max-width: 850px;
      margin: auto;
    }

    .faq-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 20px 0;
    }

    .faq-item h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #111827;
    }

    .faq-item p {
      color: #6b7280;
    }

    /* =========================
       CTA
    ========================= */

    .cta {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      text-align: center;
    }

    .cta h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .cta p {
      max-width: 700px;
      margin: 0 auto 25px;
      color: #dbeafe;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .features-grid,
      .details-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 34px;
      }
    }

    @media (max-width: 650px) {

      .language-bar {
        top: 15px;
        left: 15px;
      }

      html[dir="ltr"] .language-bar {
        left: auto;
        right: 15px;
      }

      .hero {
        padding-top: 90px;
      }

      .hero h1 {
        font-size: 29px;
      }

      .hero p {
        font-size: 17px;
      }

      .target-grid,
      .features-grid,
      .content-grid,
      .details-grid,
      .pricing-grid,
      .video-highlights {
        grid-template-columns: 1fr;
      }

      section {
        padding: 50px 0;
      }

      .section-title {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HERO
  ========================= -->

  <header class="hero">

    <div class="language-bar">
      <div class="language-switch">
        <button id="arBtn" class="active" onclick="setLanguage('ar')">
          🇪🇬 العربية
        </button>

        <button id="deBtn" onclick="setLanguage('de')">
          🇩🇪 Deutsch
        </button>
      </div>
    </div>

    <div class="container">

      <div class="hero-badge" data-ar="كورس ألماني مكثف B1/B2"
           data-de="Intensiv-Deutschkurs B1/B2">
      </div>

      <h1>
        <span data-ar="🇩🇪 كورس الألماني العملي"
              data-de="🇩🇪 Praktischer Deutschkurs">
        </span>

        <span data-ar="من اللغة إلى الاستخدام الحقيقي"
              data-de="Von der Sprache zur echten Anwendung">
        </span>
      </h1>

      <p
        data-ar="طوّر مستواك في الألمانية واستخدمها بثقة في العمل، السفر، الدراسة، المقابلات والحياة اليومية — سواء كنت في بلدك أو في ألمانيا."
        data-de="Verbessere dein Deutsch und nutze die Sprache sicher im Beruf, auf Reisen, im Studium, bei Vorstellungsgesprächen und im Alltag – egal, ob du in deinem Heimatland oder in Deutschland bist.">
      </p>

      <div class="hero-buttons">

        <a href="#pricing"
           class="btn btn-primary"
           data-ar="شوف تفاصيل الكورس"
           data-de="Kursdetails ansehen">
        </a>

        <a href="#video"
           class="btn btn-outline"
           data-ar="شاهد الكورس"
           data-de="Kurs ansehen">
        </a>

      </div>

    </div>
  </header>


  <!-- =========================
       TARGET
  ========================= -->

  <section class="target">

    <div class="container">

      <h2 class="section-title"
          data-ar="الكورس مناسب لمين؟"
          data-de="Für wen ist der Kurs geeignet?">
      </h2>

      <p class="section-subtitle"
         data-ar="الكورس مصمم لكل شخص يريد الانتقال من دراسة الألمانية إلى استخدامها بشكل عملي في الحياة الحقيقية."
         data-de="Der Kurs richtet sich an alle, die Deutsch nicht nur lernen, sondern praktisch im echten Leben anwenden möchten.">
      </p>

      <div class="target-grid">

        <div class="target-card">
          <h3 data-ar="💼 للموظفين"
              data-de="💼 Für Berufstätige">
          </h3>

          <p data-ar="استخدم الألمانية بشكل أفضل في العمل والتواصل المهني ومع العملاء والزملاء."
             data-de="Nutze Deutsch sicherer im Beruf und in der Kommunikation mit Kunden und Kollegen.">
          </p>
        </div>

        <div class="target-card">
          <h3 data-ar="🇩🇪 لمن يخطط للسفر"
              data-de="🇩🇪 Für Deutschland-Interessierte">
          </h3>

          <p data-ar="استعد لغويًا للعمل، Ausbildung، الدراسة والحياة اليومية في ألمانيا."
             data-de="Bereite dich sprachlich auf Arbeit, Ausbildung, Studium und Alltag in Deutschland vor.">
          </p>
        </div>

        <div class="target-card">
          <h3 data-ar="🎓 للطلاب والمتعلمين"
              data-de="🎓 Für Lernende">
          </h3>

          <p data-ar="طوّر مهاراتك في التحدث والاستماع والقراءة والكتابة باستخدام مواقف عملية."
             data-de="Verbessere Sprechen, Hören, Lesen und Schreiben anhand praktischer Situationen.">
          </p>
        </div>

        <div class="target-card">
          <h3 data-ar="🌍 لمن يعمل من بلده"
              data-de="🌍 Für internationale Berufstätige">
          </h3>

          <p data-ar="استخدم الألمانية مع الشركات والعملاء الألمان حتى لو كنت تعمل من خارج ألمانيا."
             data-de="Kommuniziere mit deutschen Unternehmen und Kunden – auch wenn du außerhalb Deutschlands arbeitest.">
          </p>
        </div>

      </div>
    </div>
  </section>


  <!-- =========================
       FEATURES
  ========================= -->

  <section>

    <div class="container">

      <h2 class="section-title"
          data-ar="مش مجرد كورس ألماني"
          data-de="Mehr als nur ein Deutschkurs">
      </h2>

      <p class="section-subtitle"
         data-ar="التركيز الأساسي هو أن تعرف كيف تستخدم اللغة، وليس فقط أن تعرف قواعدها."
         data-de="Der Fokus liegt darauf, Deutsch wirklich anzuwenden – nicht nur Grammatik zu lernen.">
      </p>

      <div class="features-grid">

        <div class="feature">
          <div class="feature-icon">🗣️</div>

          <h3 data-ar="تحدث بثقة"
              data-de="Sicher sprechen">
          </h3>

          <p data-ar="تدريب مستمر على المحادثة والتعبير عن نفسك في مواقف حقيقية."
             data-de="Kontinuierliches Training für Gespräche und reale Kommunikationssituationen.">
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">💼</div>

          <h3 data-ar="ألماني عملي"
              data-de="Praktisches Deutsch">
          </h3>

          <p data-ar="مواقف مرتبطة بالعمل، العملاء، المقابلات والتواصل المهني."
             data-de="Situationen aus Beruf, Kundenkontakt, Vorstellungsgesprächen und professioneller Kommunikation.">
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">🇩🇪</div>

          <h3 data-ar="الحياة اليومية"
              data-de="Alltag">
          </h3>

          <p data-ar="تعامل مع المكالمات والمواعيد والسكن والجهات المختلفة والمواقف اليومية."
             data-de="Übe Telefonate, Termine, Wohnungssuche, Behörden und typische Alltagssituationen.">
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">🎯</div>

          <h3 data-ar="تركيز على الهدف"
              data-de="Zielorientiert">
          </h3>

          <p data-ar="سواء هدفك العمل أو السفر أو الدراسة أو تطوير مستواك، التدريب عملي ومباشر."
             data-de="Ob Beruf, Reise, Studium oder persönliche Weiterentwicklung – das Training bleibt praxisnah.">
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">👥</div>

          <h3 data-ar="مجموعة صغيرة"
              data-de="Kleine Gruppe">
          </h3>

          <p data-ar="عدد محدود من المشاركين للحصول على وقت أكبر للتحدث والمشاركة."
             data-de="Begrenzte Teilnehmerzahl für mehr Sprechzeit und aktive Teilnahme.">
          </p>
        </div>

        <div class="feature">
          <div class="feature-icon">⚡</div>

          <h3 data-ar="مكثف"
              data-de="Intensiv">
          </h3>

          <p data-ar="5 أيام أسبوعيًا و10 ساعات أسبوعيًا من التدريب المباشر."
             data-de="5 Tage pro Woche und 10 Live-Stunden pro Woche.">
          </p>
        </div>

      </div>
    </div>
  </section>


  <!-- =========================
       CONTENT
  ========================= -->

  <section class="content">

    <div class="container">

      <h2 class="section-title"
          data-ar="ماذا ستتدرب عليه؟"
          data-de="Was wirst du trainieren?">
      </h2>

      <p class="section-subtitle"
         data-ar="تدريب متوازن على أهم مهارات اللغة مع التركيز على الاستخدام الحقيقي."
         data-de="Ausgewogenes Training der wichtigsten Sprachfertigkeiten mit Fokus auf die praktische Anwendung.">
      </p>

      <div class="content-grid">

        <div class="content-item"
             data-ar="المحادثة والتحدث"
             data-de="Sprechen und Konversation">
        </div>

        <div class="content-item"
             data-ar="الاستماع وفهم الكلام"
             data-de="Hörverstehen">
        </div>

        <div class="content-item"
             data-ar="القراءة وفهم النصوص"
             data-de="Leseverstehen">
        </div>

        <div class="content-item"
             data-ar="الكتابة والتعبير"
             data-de="Schreiben und Ausdruck">
        </div>

        <div class="content-item"
             data-ar="القواعد المستخدمة عمليًا"
             data-de="Praktische Grammatik">
        </div>

        <div class="content-item"
             data-ar="المفردات والتعبيرات اليومية"
             data-de="Alltagswortschatz und Redewendungen">
        </div>

        <div class="content-item"
             data-ar="التواصل في بيئة العمل"
             data-de="Kommunikation im Berufsalltag">
        </div>

        <div class="content-item"
             data-ar="المقابلات والتواصل المهني"
             data-de="Vorstellungsgespräche und berufliche Kommunikation">
        </div>

        <div class="content-item"
             data-ar="Customer Service وTechnical Support"
             data-de="Customer Service und Technical Support">
        </div>

        <div class="content-item"
             data-ar="مواقف الحياة اليومية في ألمانيا"
             data-de="Alltagssituationen in Deutschland">
        </div>

      </div>
    </div>
  </section>


  <!-- =========================
       DETAILS
  ========================= -->

  <section class="details">

    <div class="container">

      <h2 class="section-title"
          data-ar="تفاصيل الكورس"
          data-de="Kursdetails">
      </h2>

      <div class="details-grid">

        <div class="detail">
          <strong>4</strong>
          <span data-ar="أسابيع"
                data-de="Wochen">
          </span>
        </div>

        <div class="detail">
          <strong>5</strong>
          <span data-ar="أيام أسبوعيًا"
                data-de="Tage pro Woche">
          </span>
        </div>

        <div class="detail">
          <strong>2</strong>
          <span data-ar="ساعتان يوميًا"
                data-de="Stunden pro Tag">
          </span>
        </div>

        <div class="detail">
          <strong>40+</strong>
          <span data-ar="ساعة Live"
                data-de="Live-Stunden">
          </span>
        </div>

      </div>
    </div>
  </section>


  <!-- =========================
       VIDEO
  ========================= -->

  <section id="video">

    <div class="container">

  <!-- =========================
       LANGUAGE SCRIPT
  ========================= -->

  <script>

    function setLanguage(lang) {

      const html = document.documentElement;

      /*
        Change page direction
      */

      if (lang === "ar") {

        html.lang = "ar";
        html.dir = "rtl";

      } else {

        html.lang = "de";
        html.dir = "ltr";

      }


      /*
        Change all texts
      */

      document.querySelectorAll("[data-ar]").forEach(function(element) {

        if (lang === "ar") {

          element.textContent = element.getAttribute("data-ar");

        } else {

          element.textContent = element.getAttribute("data-de");

        }

      });


      /*
        Update buttons
      */

      document.getElementById("arBtn").classList.toggle(
        "active",
        lang === "ar"
      );

      document.getElementById("deBtn").classList.toggle(
        "active",
        lang === "de"
      );


      /*
        Update page title
      */

      if (lang === "ar") {

        document.title =
          "كورس الألماني العملي — من اللغة إلى الاستخدام الحقيقي";

      } else {

        document.title =
          "Praktischer Deutschkurs – Von der Sprache zur echten Anwendung";

      }


      /*
        Save selected language
      */

      localStorage.setItem("preferredLanguage", lang);

    }


    /*
      Load saved language
    */

    const savedLanguage =
      localStorage.getItem("preferredLanguage") || "ar";

    setLanguage(savedLanguage);

  </script>
